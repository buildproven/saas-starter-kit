# Dependabot configuration — optimized to reduce CI minutes
# Monthly updates, grouped by risk and dependency type, limited PRs

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    # eslint 10 breaks eslint-plugin-react-hooks (only supports ^9)
    # Ignore major eslint bumps until the plugin ecosystem catches up
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # Prettier minor releases can change formatting output. Upgrade them in a
      # dedicated migration that reformats and validates the repository.
      - dependency-name: 'prettier'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # stylelint-config-standard 40 requires stylelint 17. Upgrade both in a
      # dedicated migration instead of creating an unresolvable Dependabot PR.
      - dependency-name: 'stylelint-config-standard'
        update-types:
          - 'version-update:semver-major'
    groups:
      production-minor-and-patch:
        dependency-type: 'production'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      development-minor-and-patch:
        dependency-type: 'development'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'ci'
